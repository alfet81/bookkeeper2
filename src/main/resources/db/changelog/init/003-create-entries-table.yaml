databaseChangeLog:
  - changeSet:
      id: 1755930545795-3
      author: alfet
      objectQuotingStrategy: QUOTE_ALL_OBJECTS
      changes:
        - createTable:
            tableName: entries
            schemaName: data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_entries
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: transaction_amount
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_currency_code
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(255)
              - column:
                  name: created_date
                  type: DATETIME
              - column:
                  name: modified_date
                  type: DATETIME
        - addForeignKeyConstraint:
            constraintName: fk_entries_account_id
            baseColumnNames: account_id
            baseTableName: entries
            baseTableSchemaName: data
            referencedTableName: accounts
            referencedTableSchemaName: data
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_entries_category_id
            baseTableName: entries
            baseTableSchemaName: data
            baseColumnNames: category_id
            referencedTableName: categories
            referencedTableSchemaName: data
            referencedColumnNames: id
        - createIndex:
            indexName: idx_entries_transaction_date
            schemaName: data
            tableName: entries
            columns:
              - column:
                  name: transaction_date

