databaseChangeLog:
  - changeSet:
      id: 1755930545795-5
      author: alfet
      objectQuotingStrategy: QUOTE_ALL_OBJECTS
      changes:
        - createTable:
            tableName: labels
            schemaName: data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_labels
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
